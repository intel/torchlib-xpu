name: Bandit Scanner
on: 
  pull_request:
    branches:
      - main
      - 'release/*'
jobs:
  scan-code:
    runs-on: ubuntu-24.04
    steps:
      - name: Download project code
        uses: actions/checkout@v6
        with: 
          path: torchlib-xpu
      - name: Install Bandit
        run: pip install bandit 
      - name: Scan code
        run: bandit -r torchlib-xpu
