name: ci

# This workflow builds manylinux torchlib wheels as they will appear
# in the production environment. The challenging part is to create
# environment to properly build torchcodec which must be able to work
# in environments with different versions of FFmpeg. We handle that by
# pre-building few torchcodec op DLLs against few versions of FFmpeg.
#
# We could use quay.io/pypa/manylinux_2_28_x86_64 container instead
# of the pytorch container in all the jobs. However, with PyPa container
# we would need to setup Intel driver stack ourselves while pytorch
# container handles this for us though it weighs more.

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'
  release:
    types:
      - published      

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FBGEMM_VERSION: v1.9.0
  PR_OR_SHA: ${{ github.event.pull_request.number || github.sha }}
  UNIQUE_ID: ${{ github.run_id }}

jobs:
  # This job builds few bare minimal versions of FFmpeg with all
  # features disabled. We use the produced artifacts later building
  # torchcodec. At runtime we use other FFmpeg versions from Ubuntu
  # or Conda.
  ffmpeg:
    strategy:
      matrix:
        ffmpeg-version: [ 'n6.1.4', 'n7.1.3', 'n8.0.1', 'n9.0.1' ]
    runs-on: ubuntu-24.04
    container:
      image: 'quay.io/pypa/manylinux_2_28_x86_64'
    env:
      PREFIX: ${{ github.workspace }}/_install/ffmpeg-${{ matrix.ffmpeg-version }}
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7
      with:
        repository: FFmpeg/FFmpeg
        ref: ${{ matrix.ffmpeg-version }}
    - name: 'Install prerequisites'
      run: |
        dnf config-manager --set-enabled powertools  # for nasm
        dnf install -y nasm
    - name: 'Configure FFmpeg'
      run: |
        ./configure \
          --prefix="$PREFIX" \
          --libdir="$PREFIX/lib" \
          --disable-everything \
          --disable-static \
          --disable-doc \
          --enable-shared
    - name: 'Build and install FFmpeg'
      run: |
        make -j$(nproc) && make install
    - name: 'Verify FFmpeg'
      working-directory: ${{ env.PREFIX }}
      env:
        LD_LIBRARY_PATH: ${{ env.PREFIX }}/lib
      run: |
        ./bin/ffmpeg -version
    - name: 'Upload FFmpeg'
      uses: actions/upload-artifact@v7
      with:
        name: ffmpeg-${{ matrix.ffmpeg-version }}
        path: _install

  build:
    needs: ffmpeg
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]
    runs-on: ubuntu-24.04
    env:
      WHEELS: torchlib-${{ matrix.python-version }}-wheels
    container:
      image: 'pytorch/manylinux2_28-builder:xpu-v2.14.0-rc1'
    steps:
    - name: 'Checkout'
      uses: actions/checkout@v7
    - name: 'Download FFmpeg'
      uses: actions/download-artifact@v8
      with:
        path: ${{ github.workspace }}/_install
        # The goal is to get the following layout:
        # _install/
        #   ffmpeg-x
        #   ffmpeg-y
        merge-multiple: true
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: 'Install prerequisites'
      run: |
        rpm --import https://repositories.intel.com/gpu/intel-graphics.key
        dnf install -y libva-devel
    - name: 'Build the project'
      env:
        TORCHCODEC_FFMPEG6_INSTALL_PREFIX: ${{ github.workspace }}/_install/ffmpeg-n6.1.4
        TORCHCODEC_FFMPEG7_INSTALL_PREFIX: ${{ github.workspace }}/_install/ffmpeg-n7.1.3
        TORCHCODEC_FFMPEG8_INSTALL_PREFIX: ${{ github.workspace }}/_install/ffmpeg-n8.0.1
        TORCHCODEC_FFMPEG9_INSTALL_PREFIX: ${{ github.workspace }}/_install/ffmpeg-n9.0.1
      run: |
        source /opt/intel/oneapi/setvars.sh
        uv build --all --index https://download.pytorch.org/whl/xpu -vv
    - name: 'Repair wheels with auditwheel'
      run: |
        uvx auditwheel repair dist/*.whl \
          --wheel-dir _wheels/${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }} \
          --exclude "*" --allow-pure-python-wheel
    - name: 'Test installing wheels'
      run: |
        uv venv
        uv pip install \
          _wheels/${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}/*.whl \
          --index https://download.pytorch.org/whl/xpu -vv
    - name: 'Upload wheels'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        path: _wheels
        compression-level: 0

  # This job just merges all wheels into single archive
  compose:
    needs: build
    runs-on: ubuntu-24.04
    env:
      WHEELS: torchlib-all-wheels
    steps:
    - name: 'Download wheels'
      uses: actions/download-artifact@v8
      with:
        pattern: torchlib-*
        path: _all_wheels
        # The goal is to get the following layout:
        # _all_wheels/
        #   torchlib-3.14-wheels-xxx-yyy
        #   torchlib-3.13-wheels-xxx-yyy
        merge-multiple: true
    - name: 'Install prerequisites'
      run: |
        sudo apt-get update
        sudo apt-get install -y tree
    - name: 'List downloads'
      run: |
        tree _all_wheels/
    - name: 'Form uploads'
      run: |
        TO=${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        mkdir _wheels && mkdir _wheels/$TO
        find _all_wheels/ -name "*-cp[0-9]*-cp[0-9]*-*.whl" \
          -exec cp {} _wheels/$TO \;
        # Take "*-none-any.whl" from the oldest python we've built for
        find "$(ls -d _all_wheels/*/ | sort | head -n 1)" -name "*-none-any.whl" \
          -exec cp {} _wheels/$TO \;
    - name: 'List uploads'
      run: |
        tree _wheels/
    - name: 'Upload wheels'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        path: _wheels/
        compression-level: 0

  identify-changes:
    runs-on: ubuntu-24.04
    outputs:
      torchcodec-xpu: ${{ case(github.event_name == 'release', 'true',
                            github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-all'), 'true',
                            steps.changes.outputs.torchcodec-xpu || 'false') }}
      fbgemm-xpu: ${{ case(github.event_name == 'release', 'true',
                        github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-all'), 'true',
                        steps.changes.outputs.fbgemm-xpu || 'false') }}
      dlrm-v3: ${{ case(github.event_name == 'release', 'true',
                     github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-all'), 'true',
                     github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'test-dlrm-v3'), 'true',
                     steps.changes.outputs.dlrm-v3 || 'false') }}
    steps:
      - name: 'Checkout'
        if: github.event_name != 'release'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 'Identify changes'
        if: github.event_name != 'release'
        uses: dorny/paths-filter@v4
        id: changes
        with:
          base: ${{ github.event.before || 'HEAD~1' }}
          filters: |
            torchcodec-xpu:
              - 'packages/torchcodec-xpu/**'
            fbgemm-xpu:
              - 'packages/fbgemm-xpu/**'
            dlrm-v3:
              - 'packages/fbgemm-xpu/**'
              - '.github/workflows/ci.yml'

  test-torchcodec:
    needs: [ build, identify-changes ]
    if: needs.identify-changes.outputs.torchcodec-xpu == 'true'
    strategy:
      matrix:
        image: [ 'ubuntu:24.04', 'ubuntu:26.04' ]
        # Testing in minimum and maximum supported versions of python.
        python-version: [ '3.10']
        runner: [ 'bmg', 'dg2' ]
        # Testing n8 as (probably) most popular version (it's available in Ubuntu 26.04)
        ffmpeg-version: [ 'n6.1.4', 'n7.1.3', 'n8.0.1', 'n9.0.1' ]
        # Default fallback value for standard matrix combinations
        cpu_fallback: [ false ]  # fallback not allowed
        force_cpu_fallback: [ false ]

        include:
        # This verifies all other supported version of python
        - image: 'ubuntu:26.04'
          python-version: '3.11'
          runner: 'bmg'
          ffmpeg-version: 'n8.0.1'
        - image: 'ubuntu:26.04'
          python-version: '3.12'
          runner: 'bmg'
          ffmpeg-version: 'n8.0.1'
        - image: 'ubuntu:26.04'
          python-version: '3.13'
          runner: 'bmg'
          ffmpeg-version: 'n8.0.1'
        - image: 'ubuntu:26.04'
          python-version: '3.14'
          runner: 'bmg'
          ffmpeg-version: 'n8.0.1'
        # This verifies default behavior when CPU fallback is allowed and not forced
        - image: 'ubuntu:26.04'
          python-version: '3.14'
          runner: 'bmg'
          ffmpeg-version: 'n8.0.1'
          cpu_fallback: true
          force_cpu_fallback: false
        # This verifies forced fallback scenario when decoding is entirely on CPU
        - image: 'ubuntu:26.04'
          python-version: '3.14'
          runner: 'bmg'
          ffmpeg-version: 'n8.0.1'
          cpu_fallback: true
          force_cpu_fallback: true
    runs-on: ${{matrix.runner}}
    container:
      image: '${{ matrix.image }}'
      options: --device /dev/dri:/dev/dri -v /dev/dri/by-path:/dev/dri/by-path
    env:
      CPU_FALLBACK: ${{ matrix.cpu_fallback == true }}
      FORCE_CPU_FALLBACK: ${{ matrix.force_cpu_fallback == true }}
      TORCHCODEC_XPU_LOG_LEVEL: '3'  # info
      WHEELS: torchlib-${{ matrix.python-version }}-wheels
      FFMPEG_PREFIX: ${{ github.workspace }}/_install
    steps:
    - name: 'Cleanup'
      run: |
        # Workspaces persist on self-hosted runners and may get polluted with the
        # previous states. Here we thuroughly clean up our worspace.
        # 1. Remove virtual environment
        rm -rf .torchlib-xpu-venv
        # 2. Remove custom folders we've created for artifacts, builds, etc.
        rm -rf _install _tools _wheels
        # 3. Remove clone copies
        rm -rf ffmpeg torchcodec torchlib-xpu
    - name: 'Set AGENT_TOOLSDIRECTORY'
      run: |
        # For https://github.com/actions/setup-python/issues/1087
        echo "AGENT_TOOLSDIRECTORY=$GITHUB_WORKSPACE/_tools" >> $GITHUB_ENV
    # This step installs basic prerequisites to make Git and external APT repository
    # working inside the container.
    - name: 'Install prerequisites'
      run: |
        apt-get update
        apt-get install -y \
          ca-certificates \
          curl \
          git \
          gpg \
          software-properties-common \
          wget
        git config --global user.email "nobody@intel.com"
        git config --global user.name "Nobody"
    - name: 'Download wheels'
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        path: _wheels/
    - name: 'Checkout torchlib-xpu'
      uses: actions/checkout@v7
      with:
        path: torchlib-xpu
    - name: 'Checkout torchcodec'
      uses: actions/checkout@v7
      with:
        repository: meta-pytorch/torchcodec
        ref: v0.17.0
        path: torchcodec
    - name: 'Checkout ffmpeg'
      uses: actions/checkout@v7 
      with: 
        repository: FFmpeg/FFmpeg 
        ref: ${{ matrix.ffmpeg-version }}
        path: ffmpeg
    - name: 'Patch torchcodec'
      working-directory: torchcodec
      run: |
        git am ../torchlib-xpu/packages/torchcodec-xpu/patches/0001-Add-XPU-support-to-tests.patch
        git am ../torchlib-xpu/packages/torchcodec-xpu/patches/0002-Add-XPU-support-to-video-encoder-tests.patch
    - name: 'Install Intel drivers, FFmpeg and test prerequisites'
      run: |
        add-apt-repository -y ppa:kobuk-team/intel-graphics
        # Uncomment below to install packages available at specific date
        # echo "Snapshot: 20260624T090400Z" >> /etc/apt/sources.list.d/kobuk-team-ubuntu-intel-graphics-noble.sources
        # apt-get update
        apt-get install -y \
          build-essential \
          intel-media-va-driver-non-free \
          intel-opencl-icd \
          libaom-dev \
          libmp3lame-dev \
          libva-dev \
          libva2 \
          libvpx-dev \
          libx264-dev \
          libx265-dev \
          libze-intel-gpu1 \
          libze1 \
          nasm \
          pkg-config \
          zlib1g-dev
    - name: 'Configure FFmpeg from source'
      working-directory: ffmpeg
      run: |
        ./configure \
          --prefix="$FFMPEG_PREFIX" \
          --libdir="$FFMPEG_PREFIX/lib" \
          --disable-static \
          --disable-stripping \
          --disable-doc \
          --enable-shared \
          --enable-vaapi \
          --enable-libmp3lame \
          --enable-gpl \
          --enable-libaom \
          --enable-libx264 \
          --enable-libx265 \
          --enable-libvpx
    - name: 'Build and install FFmpeg'
      working-directory: ffmpeg
      run: |
        make -j$(nproc) && make install
        echo "$FFMPEG_PREFIX/bin" >> $GITHUB_PATH
        echo "LD_LIBRARY_PATH=$FFMPEG_PREFIX/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
    - name: 'Print FFmpeg version'
      run: |
        ffmpeg -version
    - name: 'Set up Python ${{ matrix.python-version }}'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: 'Create virtual environment'
      run: |
        python -m venv .torchlib-xpu-venv
        echo "$GITHUB_WORKSPACE/.torchlib-xpu-venv/bin" >> $GITHUB_PATH
    - name: 'Install torchcodec'
      run: |
        find _wheels/ -name "*.whl"
        pip install --no-cache-dir \
          "$(ls ./_wheels/${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}/torchcodec*.whl)[test]" \
          --extra-index-url https://download.pytorch.org/whl/xpu
    - name: 'Test gpu'
      run: |
        python -c "import torch; assert torch.xpu.is_available(), 'XPU (Intel GPU) is not available'"
    - name: 'Test'
      working-directory: torchcodec
      run: |
        known_failures="not test_full_range_10bit[xpu]"
        if [ "$FORCE_CPU_FALLBACK" = "true" ] || [ "${{ matrix.image }}" = "ubuntu:24.04" ] || [ "${{ matrix.runner }}" = "dg2" ]; then
          # On dg2 see: https://github.com/intel/media-driver/issues/1954
          known_failures="${known_failures} and not test_get_frame_at_av1[xpu]"
        fi
        pytest -rsf --capture=no -k "${known_failures}" test/

  test-fbgemm:
    needs: [ build, identify-changes ]
    if: needs.identify-changes.outputs.fbgemm-xpu == 'true'
    strategy:
      max-parallel: 1
      matrix:
        # Testing in minimum and maximum supported versions of python.
        python-version: [ '3.10', '3.14' ]
        runner: [ 'bmg' ]
    runs-on: ${{matrix.runner}}
    container:
      image: 'ubuntu:24.04'
      options: --device /dev/dri:/dev/dri -v /dev/dri/by-path:/dev/dri/by-path
    env:
      WHEELS: torchlib-${{ matrix.python-version }}-wheels
    steps:
    - name: 'Cleanup'
      run: |
        # Workspaces persist on self-hosted runners and may get polluted with the
        # previous states. Here we thuroughly clean up our worspace.
        # 1. Remove virtual environment
        rm -rf .torchlib-xpu-venv
        # 2. Remove custom folders we've created for artifacts, builds, etc.
        rm -rf _install _tools _wheels
        # 3. Remove clone copies
        rm -rf fbgemm torchlib-xpu
    - name: Set AGENT_TOOLSDIRECTORY
      run: |
        # For https://github.com/actions/setup-python/issues/1087
        echo "AGENT_TOOLSDIRECTORY=$GITHUB_WORKSPACE/_tools" >> $GITHUB_ENV
    - name: 'Install prerequisites'
      run: |
        apt-get update
        apt-get install -y \
          ca-certificates \
          curl \
          git \
          gpg \
          software-properties-common \
          wget
        git config --global user.email "nobody@intel.com"
        git config --global user.name "Nobody"
    - name: 'Download wheels'
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        path: _wheels/
    - name: 'Checkout torchlib-xpu'
      uses: actions/checkout@v7
      with:
        path: torchlib-xpu
    - name: 'Checkout fbgemm'
      uses: actions/checkout@v7
      with:
        repository: pytorch/FBGEMM
        ref: ${{ env.FBGEMM_VERSION }}
        path: fbgemm
    - name: 'Install Intel drivers'
      run: |
        add-apt-repository -y ppa:kobuk-team/intel-graphics
        apt-get install -y \
          libze1 \
          libze-intel-gpu1 \
          intel-ocloc
    - name: 'Set up Python ${{ matrix.python-version }}'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: 'Create virtual environment'
      run: |
        python -m venv .torchlib-xpu-venv
        echo "$GITHUB_WORKSPACE/.torchlib-xpu-venv/bin" >> $GITHUB_PATH
    - name: 'Install fbgemm-xpu'
      run: |
        pip install --no-cache-dir \
          "$(ls ./_wheels/${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}/fbgemm_xpu*.whl)[test]" \
          --extra-index-url https://download.pytorch.org/whl/xpu
    - name: 'Test gpu'
      run: |
        python -c "import torch; assert torch.xpu.is_available(), 'XPU (Intel GPU) is not available'"
    - name: 'Test fbgemm-xpu'
      run: |
        # Upstream FBGEMM tests (patched) cover shared operator behavior and parity.
        # The tests below cover XPU/SYCL cases that upstream does not:
        # launch-grid limits, device validation, and strided fast-path inputs.
        # faulthandler_timeout dumps every thread's stack if a test runs over
        # 10 minutes, so a hang shows where it is stuck.
        pytest -rsf torchlib-xpu/packages/fbgemm-xpu/tests/
    - name: 'Smoke run jagged sweep'
      run: |
        # jagged-sweep checks each case against CPU before timing it; the
        # timings themselves are not used, so the PVC baseline is not compared
        # against this runner.
        python -m fbgemm_xpu.bench.jagged_sweep --smoke --output "$RUNNER_TEMP/jagged_sweep_smoke.csv"
    - name: 'Patch upstream FBGEMM tests and benchmarks'
      working-directory: fbgemm
      run: |
        git am ../torchlib-xpu/packages/fbgemm-xpu/patches/0001-Add-XPU-support-to-fbgemm-tests.patch
        git am ../torchlib-xpu/packages/fbgemm-xpu/patches/0002-Add-XPU-support-to-fbgemm-jagged-benchmark.patch
        unexpected=$(git diff --name-only "$FBGEMM_VERSION" HEAD | grep -vE '^fbgemm_gpu/(test|bench)/' || true)
        if [ -n "$unexpected" ]; then
          echo "Patches modified non-test, non-bench FBGEMM files:"
          echo "$unexpected"
          exit 1
        fi
        unexpected=$(git diff --name-only HEAD~1 HEAD | grep -v '^fbgemm_gpu/bench/' || true)
        if [ -n "$unexpected" ]; then
          echo "Benchmark patch modified non-bench FBGEMM files:"
          echo "$unexpected"
          exit 1
        fi
    - name: 'Test patched upstream test suite'
      working-directory: fbgemm
      run: |
        pytest -rsf fbgemm_gpu/test/jagged/expand_into_jagged_permute_test.py
        pytest -rsf fbgemm_gpu/test/jagged/jagged_index_select_2d_test.py
        pytest -rsf fbgemm_gpu/test/jagged/dense_to_jagged_test.py
        pytest -rsf fbgemm_gpu/test/jagged/jagged_to_padded_dense_test.py
        pytest -rsf fbgemm_gpu/test/jagged/2d_to_dense_test.py
        pytest -rsf fbgemm_gpu/test/jagged/1d_to_dense_test.py
        pytest -rsf fbgemm_gpu/test/jagged/elementwise_binary_test.py
        pytest -rsf fbgemm_gpu/test/merge_pooled_embeddings_test.py
        pytest -rsf fbgemm_gpu/test/sparse/block_bucketize_test.py
        pytest -rsf fbgemm_gpu/test/sparse/cumsum_test.py
        pytest -rsf fbgemm_gpu/test/sparse/misc_ops_test.py
        pytest -rsf fbgemm_gpu/test/sparse/permute_sparse_features_test.py
        pytest -rsf fbgemm_gpu/test/sparse/reorder_batched_test.py
        pytest -rsf fbgemm_gpu/test/tbe/utils/generate_vbe_metadata_test.py
        pytest -rsf fbgemm_gpu/test/tbe/utils/split_embeddings_utils_test.py
    - name: 'Smoke run patched upstream jagged benchmark'
      working-directory: fbgemm
      run: |
        # Exercises the benchmark patch on every run.
        python fbgemm_gpu/bench/jagged_tensor_benchmark.py device --batch-size 8 --max-len 16

  # End-to-end DLRM-v3 on XPU across the integrated stack: fbgemm-xpu (built
  # above) + FBGEMM + TorchRec + generative-recommenders (DLRM-v3). Every
  # external source is pinned to a commit in `env` below. How to run the same
  # steps locally: packages/fbgemm-xpu/README.md, "End-to-end DLRM-v3 tests".
  test-dlrm-v3:
    needs: [ build, identify-changes, test-fbgemm ]
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && needs.identify-changes.outputs.dlrm-v3 == 'true'
      && contains(fromJSON('["success", "skipped"]'), needs.test-fbgemm.result)
    strategy:
      max-parallel: 1
      matrix:
        # Testing in minimum and maximum supported versions of python.
        python-version: [ '3.10', '3.14' ]
        runner: [ 'bmg' ]
        include:
          # NumPy 2.5.3 and pandas 3.0.5 need Python 3.12+; 3.10 uses the
          # newest NumPy and pandas releases that still support it.
          - python-version: '3.10'
            numpy: '2.2.6'
            pandas: '2.3.3'
          - python-version: '3.14'
            numpy: '2.5.3'
            pandas: '3.0.5'
    runs-on: ${{matrix.runner}}
    timeout-minutes: 150
    container:
      image: 'ubuntu:24.04'
      # DataLoader workers and spawned ranks exchange tensors through /dev/shm.
      options: --device /dev/dri:/dev/dri -v /dev/dri/by-path:/dev/dri/by-path --shm-size=8g
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      WHEELS: torchlib-${{ matrix.python-version }}-wheels
      # aagalleg/FBGEMM#1 (ComputeDevice.XPU): its Python changes are applied
      # over the fbgemm-gpu-cpu 1.9.0 wheel. BASE is the PR's base commit.
      FBGEMM_PR_REPO: aagalleg/FBGEMM
      FBGEMM_PR_BASE: c0c345570fed8ae3c8850dcf3bd1b37961aafbb8
      FBGEMM_PR_HEAD: f2e945395a299b3738fbe66c664c7ed1ecd09666
      # manuelhsantana/torchrec#3 (XPU in planner, sharding, training) with
      # manuelhsantana/torchrec#4 (quantized inference) merged into it.
      TORCHREC_REPO: manuelhsantana/torchrec
      TORCHREC_SHA: 072b992e6b5cee372548fb62fbecf12c9e553dc2
      # aagalleg/generative-recommenders#3: DLRM-v3 training on XPU.
      GR_TRAIN_REPO: aagalleg/generative-recommenders
      GR_TRAIN_SHA: 6ecb92103da2c0d251759d84b65c53664c4bb29a
      ML1M_URL: https://files.grouplens.org/datasets/movielens/ml-1m.zip
      ML1M_SHA256: a6898adb50b9ca05aa231689da44c217cb524e7ebd39d264c56e2832f2c54e20
      # sasrec_format.csv written by GR's preprocessor from that archive, seeded
      # and with a stable sort (see 'Prepare MovieLens-1M').
      ML1M_PREPARED_SHA256: 9c00321c268f9eec22b18ceac14a909d7fa066f47f5e0eff1e4091ef6b965eeb
    steps:
    - name: 'Cleanup'
      run: |
        # Workspaces persist on self-hosted runners; start from a clean state.
        rm -rf .torchlib-xpu-venv _e2e _tools _wheels
        rm -rf fbgemm-pr gr-train torchrec
    - name: 'Set AGENT_TOOLSDIRECTORY'
      run: |
        # For https://github.com/actions/setup-python/issues/1087
        echo "AGENT_TOOLSDIRECTORY=$GITHUB_WORKSPACE/_tools" >> $GITHUB_ENV
        echo "E2E=$GITHUB_WORKSPACE/_e2e" >> $GITHUB_ENV
        echo "VENV=$GITHUB_WORKSPACE/.torchlib-xpu-venv" >> $GITHUB_ENV
    - name: 'Install prerequisites'
      run: |
        apt-get update
        # build-essential: the Triton launcher is compiled at runtime.
        apt-get install -y \
          build-essential \
          ca-certificates \
          curl \
          git \
          gpg \
          patch \
          software-properties-common \
          unzip \
          wget
        git config --global user.email "nobody@intel.com"
        git config --global user.name "Nobody"
        mkdir -p "$E2E/logs"
    - name: 'Install Intel drivers'
      run: |
        add-apt-repository -y ppa:kobuk-team/intel-graphics
        apt-get install -y \
          intel-ocloc \
          libze-dev \
          libze-intel-gpu1 \
          libze1
    - name: 'Download wheels'
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        path: _wheels/
    - name: 'Checkout TorchRec'
      uses: actions/checkout@v7
      with:
        repository: ${{ env.TORCHREC_REPO }}
        ref: ${{ env.TORCHREC_SHA }}
        path: torchrec
    - name: 'Checkout generative-recommenders (training)'
      uses: actions/checkout@v7
      with:
        repository: ${{ env.GR_TRAIN_REPO }}
        ref: ${{ env.GR_TRAIN_SHA }}
        path: gr-train
    - name: 'Set up Python ${{ env.PYTHON_VERSION }}'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: 'Create virtual environment'
      run: |
        python -m venv "$VENV"
        echo "$VENV/bin" >> $GITHUB_PATH
    - name: 'Install fbgemm-xpu'
      run: |
        # Pulls torch (XPU) and fbgemm-gpu-cpu==1.9.0.
        pip install --no-cache-dir \
          "$(ls ./_wheels/${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}/fbgemm_xpu*.whl)" \
          --extra-index-url https://download.pytorch.org/whl/xpu
    - name: 'Install TorchRec and DLRM-v3 dependencies'
      run: |
        torch_version=$(python -c "import torch; print(torch.__version__)")
        pip install --no-cache-dir \
          "torch==$torch_version" \
          click==8.5.0 \
          expecttest==0.3.0 \
          gin-config==0.5.0 \
          hypothesis==6.168.0 \
          iopath==0.1.10 \
          numpy==${{ matrix.numpy }} \
          pandas==${{ matrix.pandas }} \
          parameterized==0.9.0 \
          pyarrow==25.0.1 \
          pybind11==3.1.0 \
          pyre-extensions==0.0.32 \
          pytest==9.1.1 \
          setuptools==78.1.0 \
          tabulate==0.10.0 \
          tensorboard==2.21.0 \
          tensordict==0.14.2 \
          torchmetrics==1.0.3 \
          tqdm==4.70.1 \
          wheel==0.48.0 \
          --extra-index-url https://download.pytorch.org/whl/xpu
        # --no-deps: TorchRec requires fbgemm-gpu, the CUDA build; the CPU
        # build fbgemm-gpu-cpu is installed with fbgemm-xpu instead.
        pip install --no-cache-dir --no-deps --no-build-isolation ./torchrec
        if pip show fbgemm-gpu >/dev/null 2>&1; then
          echo "The CUDA build of FBGEMM (fbgemm-gpu) must not be installed"
          exit 1
        fi
        python -c "import torch; assert torch.__version__ == '$torch_version', torch.__version__"
    - name: 'Apply aagalleg/FBGEMM#1 over fbgemm-gpu-cpu 1.9.0'
      run: |
        git init -q fbgemm-pr
        git -C fbgemm-pr remote add origin "https://github.com/$FBGEMM_PR_REPO.git"
        # Blob-less fetch: git diff downloads only the blobs it compares.
        git -C fbgemm-pr fetch -q --depth=1 --filter=blob:none origin "$FBGEMM_PR_BASE" "$FBGEMM_PR_HEAD"
        git -C fbgemm-pr diff "$FBGEMM_PR_BASE" "$FBGEMM_PR_HEAD" -- fbgemm_gpu/fbgemm_gpu \
          > "$E2E/logs/fbgemm-pr.diff"
        unexpected=$(grep '^+++ ' "$E2E/logs/fbgemm-pr.diff" | grep -vE '^\+\+\+ b/fbgemm_gpu/fbgemm_gpu/.*\.py$' || true)
        if [ -n "$unexpected" ] || [ ! -s "$E2E/logs/fbgemm-pr.diff" ]; then
          echo "Expected a non-empty diff of Python files of the fbgemm_gpu package only:"
          echo "$unexpected"
          exit 1
        fi
        site=$(python -c "import fbgemm_gpu, os; print(os.path.dirname(os.path.dirname(fbgemm_gpu.__file__)))")
        patch -d "$site" -p2 --forward --batch < "$E2E/logs/fbgemm-pr.diff"
        python - <<'EOF'
        import torch
        from fbgemm_gpu.split_table_batched_embeddings_ops_training import get_available_compute_device
        from fbgemm_gpu.tbe.config import ComputeDevice

        assert torch.xpu.is_available(), "XPU (Intel GPU) is not available"
        assert ComputeDevice.XPU == 3, list(ComputeDevice)
        assert ComputeDevice.get_available() == ComputeDevice.XPU, ComputeDevice.get_available()
        assert get_available_compute_device() == ComputeDevice.XPU, get_available_compute_device()
        print("ComputeDevice:", list(ComputeDevice))
        EOF
        pip freeze > "$E2E/logs/pip-freeze.txt"
    - name: 'Test stack on XPU (FBGEMM, TorchRec, fbgemm-xpu)'
      run: |
        export CCL_ROOT="$VENV" LD_LIBRARY_PATH="$VENV/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        python - <<'EOF'
        # Training (torchrec#3 + FBGEMM#1): one step of a fused
        # EmbeddingCollection on xpu:0 vs plain torch.
        import os
        import sys

        import torch
        import torch.distributed as dist

        DEV = os.environ.get("E2E_DEVICE", "xpu")
        if DEV == "xpu":
            import fbgemm_xpu  # noqa: F401
        device = torch.device(f"{DEV}:0")

        from fbgemm_gpu.split_embedding_configs import EmbOptimType
        from fbgemm_gpu.tbe.config import ComputeDevice
        from torchrec import EmbeddingCollection, EmbeddingConfig, KeyedJaggedTensor
        from torchrec.distributed.embedding import EmbeddingCollectionSharder
        from torchrec.distributed.model_parallel import DistributedModelParallel
        from torchrec.distributed.planner import EmbeddingShardingPlanner, Topology
        from torchrec.distributed.planner.types import ParameterConstraints
        from torchrec.distributed.utils import get_device_type
        from torchrec.test_utils import get_free_port

        NUM_ROWS, DIM, BATCH, LR, EPS = 64, 16, 8, 0.1, 1e-8
        torch.manual_seed(0)
        tables = [
            EmbeddingConfig(num_embeddings=NUM_ROWS, embedding_dim=DIM, name=f"t{i}", feature_names=[f"f{i}"])
            for i in range(2)
        ]


        def make_kjt():
            g = torch.Generator().manual_seed(1)
            lengths = torch.randint(0, 4, (2 * BATCH,), generator=g)
            values = torch.randint(0, NUM_ROWS, (int(lengths.sum()),), generator=g)
            return KeyedJaggedTensor.from_lengths_sync(keys=["f0", "f1"], values=values, lengths=lengths)


        def check(name, ok, detail=""):
            print(f"{'PASS' if ok else 'FAIL'} {name} {detail}", flush=True)
            if not ok:
                sys.exit(1)


        def local(tensor):
            return (tensor.local_tensor() if hasattr(tensor, "local_tensor") else tensor).cpu()


        if DEV == "xpu":
            check("torchrec.get_device_type", get_device_type() == "xpu", get_device_type())
            torch.xpu.set_device(device)
        check("fbgemm.ComputeDevice.XPU", hasattr(ComputeDevice, "XPU"), str(list(ComputeDevice)))

        os.environ.update(MASTER_ADDR="127.0.0.1", MASTER_PORT=str(get_free_port()))
        backend = "xccl" if DEV == "xpu" and dist.is_xccl_available() else "gloo"
        dist.init_process_group(backend=backend, rank=0, world_size=1)
        print(f"process group: {backend}", flush=True)

        ec = EmbeddingCollection(tables=tables, device=torch.device("meta"))
        sharder = EmbeddingCollectionSharder(
            fused_params={"optimizer": EmbOptimType.EXACT_ROWWISE_ADAGRAD, "learning_rate": LR, "eps": EPS}
        )
        topology = Topology(world_size=1, compute_device=DEV)
        constraints = {
            t.name: ParameterConstraints(sharding_types=["table_wise"], compute_kernels=["fused"]) for t in tables
        }
        plan = EmbeddingShardingPlanner(topology=topology, constraints=constraints).plan(ec, [sharder])
        model = DistributedModelParallel(ec, device=device, plan=plan, sharders=[sharder], init_data_parallel=False)
        weights = {name: torch.rand(NUM_ROWS, DIM) for name in ("t0", "t1")}
        for name, tensor in model.state_dict().items():
            weights_table = weights[name.split(".")[-2]]
            (tensor.local_tensor() if hasattr(tensor, "local_tensor") else tensor).copy_(weights_table)
        if DEV == "xpu":
            # Sharded modules keep their lookups in a plain list, which
            # modules() does not traverse.
            tbes = [
                sub
                for m in model.modules()
                for lookup in getattr(m, "_lookups", [])
                for sub in lookup.modules()
                if hasattr(sub, "use_cpu")
            ]
            placement = [
                (m.use_cpu, m.weights_dev.device.type, m.weights_host.numel(), m.weights_uvm.numel())
                for m in tbes
            ]
            check(
                "training.tbe_on_xpu",
                bool(placement) and all(p == (False, "xpu", 0, 0) for p in placement),
                f"(use_cpu, weights_dev device, weights_host numel, weights_uvm numel) per TBE: {placement}",
            )

        kjt = make_kjt()
        out = model(kjt.to(device))
        sum((out[k].values() * (i + 1)).sum() for i, k in enumerate(("f0", "f1"))).backward()
        state = {name.split(".")[-2]: local(tensor) for name, tensor in model.state_dict().items()}
        for i, (key, table) in enumerate((("f0", "t0"), ("f1", "t1"))):
            ids, w = kjt[key].values(), weights[table]
            torch.testing.assert_close(out[key].values().detach().cpu(), w[ids], atol=1e-5, rtol=1e-5)
            grad = torch.zeros(NUM_ROWS, DIM).index_add_(0, ids, torch.full((ids.numel(), DIM), float(i + 1)))
            momentum = grad.square().mean(dim=1)
            expected = w - (LR / (momentum.sqrt() + EPS))[:, None] * grad
            torch.testing.assert_close(state[table], expected, atol=1e-5, rtol=1e-5)
            check(f"training.{table}", True, "lookup and row-wise Adagrad update == reference")

        dist.destroy_process_group()
        EOF
    - name: 'Test TorchRec XPU changes (device-agnostic unit tests)'
      working-directory: torchrec
      run: |
        # The test files changed by torchrec#3; they mock the
        # accelerator and run on the CPU.
        PYTHONPATH="$PWD" pytest -rsf -p no:cacheprovider \
          torchrec/distributed/planner/tests/test_constants.py \
          torchrec/distributed/planner/tests/test_storage_reservations.py \
          torchrec/distributed/planner/tests/test_types.py \
          torchrec/distributed/planner/tests/test_utils.py \
          torchrec/distributed/tests/test_embedding_types.py \
          torchrec/distributed/tests/test_sharding_plan.py \
          torchrec/distributed/tests/test_utils.py
    - name: 'Prepare MovieLens-1M'
      run: |
        mkdir -p "$E2E/prep/tmp" "$E2E/data/data"
        curl -fsSL --retry 3 -o "$E2E/prep/tmp/movielens1m.zip" "$ML1M_URL"
        echo "$ML1M_SHA256  $E2E/prep/tmp/movielens1m.zip" | sha256sum -c -
        # GR's preprocessor finds the archive in tmp/ and does not download it
        # again. It shuffles with NumPy's global RNG, so seed it.
        cd "$E2E/prep"
        PYTHONPATH="$GITHUB_WORKSPACE/gr-train" python -c "
        import numpy as np
        import pandas as pd
        np.random.seed(0)
        sort_values = pd.DataFrame.sort_values
        pd.DataFrame.sort_values = lambda self, *args, **kwargs: sort_values(self, *args, **{**kwargs, 'kind': 'stable'})
        from generative_recommenders.research.data.preprocessor import get_common_preprocessors
        get_common_preprocessors()['ml-1m'].preprocess_rating()
        "
        mv tmp/ml-1m "$E2E/data/data/ml-1m"
        echo "$ML1M_PREPARED_SHA256  $E2E/data/data/ml-1m/sasrec_format.csv" | sha256sum -c -
    - name: 'Run DLRM-v3 training on XPU (train-eval smoke)'
      working-directory: gr-train
      # The container's sh (dash) has no pipefail.
      shell: bash
      run: |
        # Shortened copy of movielens_1m_xpu.gin: the overrides come last, and
        # gin keeps the last binding of a parameter.
        gin=generative_recommenders/dlrm_v3/train/gin/movielens_1m_xpu.gin
        cat >> "$gin" <<EOF

        # torchlib-xpu CI (test-dlrm-v3): bounded train-eval smoke.
        make_train_test_dataloaders.new_path_prefix = "$E2E/data"
        train_eval_loop.num_epochs = 1
        train_eval_loop.num_train_batches = 40
        train_eval_loop.eval_frequency = 20
        train_eval_loop.num_eval_batches = 5
        MetricsLogger.tensorboard_log_path = "$E2E/logs/tensorboard"
        EOF
        cp "$gin" "$E2E/logs/"
        export PYTHONPATH="$PWD" WORLD_SIZE=1
        export CCL_ROOT="$VENV" LD_LIBRARY_PATH="$VENV/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
        set -o pipefail
        timeout --kill-after=30s 3600s python -m generative_recommenders.dlrm_v3.train.train_ranker \
          --dataset movielens-1m-xpu --mode train-eval 2>&1 | tee "$E2E/logs/train.log"
    - name: 'Check DLRM-v3 training log'
      run: |
        python - "$E2E/logs/train.log" <<'EOF'
        import math, re, sys

        text = open(sys.argv[1]).read()
        step = re.compile(r"(train|eval) - Step (\d+) metrics: (\{.*\})")
        metric = re.compile(r"'([^']+)':\s*(?:tensor\()?\s*([-+0-9.eE]+|nan|inf)")
        rank_hbm = re.compile(r"^\W*(\d+)\W+([\d.]+) \((\d+)%\)")
        steps = {"train": [], "eval": []}
        last_eval, not_finite = {}, []
        for mode, n, metrics in step.findall(text):
            steps[mode].append(int(n))
            values = {k: float(v) for k, v in metric.findall(metrics)}
            not_finite += [f"{mode} {n} {k}" for k, v in values.items() if not math.isfinite(v)]
            if mode == "eval":
                last_eval = values
        hbm = {}
        for line in text.splitlines():
            if "planner.stats:" not in line:
                continue
            line = line.split("planner.stats:", 1)[1]
            match = rank_hbm.match(line)
            if match and "HBM" not in line:
                hbm.setdefault(int(match[1]), float(match[2]))
        failures = []
        if "Traceback (most recent call last)" in text:
            failures.append("traceback in the log")
        if not steps["train"] or not steps["eval"]:
            failures.append(f"train steps {steps['train']}, eval steps {steps['eval']}")
        if not hbm or not all(v > 0 for v in hbm.values()):
            failures.append(f"planner HBM per rank {hbm}")
        if not_finite:
            failures.append(f"non-finite metrics: {not_finite[:5]}")
        print(f"train steps {steps['train']}, eval steps {steps['eval']}, planner HBM GB {hbm}")
        print(f"last eval metrics {last_eval}")
        if failures:
            sys.exit("FAIL: " + "; ".join(failures))
        EOF
    - name: 'Upload DLRM-v3 logs'
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: dlrm-v3-logs-${{ matrix.python-version }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        path: |
          _e2e/logs
        if-no-files-found: ignore

  publish:
    needs: [ compose, test-torchcodec, test-fbgemm, test-dlrm-v3 ]
    if: ${{ !(failure() || cancelled()) }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write    
    env:
      WHEELS: torchlib-all-wheels
    steps:
    - name: 'Download wheels'
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}
        path: _wheels
    - name: 'List wheels'
      run: |
        tree _wheels/
    - name: 'Prepare wheels'
      run: |
        rm -rf _publish && mkdir _publish
        cp ./_wheels/${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}/torchcodec_xpu-*.whl _publish/
        cp ./_wheels/${{ env.WHEELS }}-${{ env.PR_OR_SHA }}-${{ env.UNIQUE_ID }}/torchlib_xpu-*.whl _publish/
        ls -al _publish/
    - name: Publish package distributions to PyPI
      if: github.event_name == 'release'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: _publish
